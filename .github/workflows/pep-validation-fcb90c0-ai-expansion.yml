name: PEP fcb90c0 AI-component existing-package expansion, 94 staging cases (temporary)
# Temporary, branch-scoped caller; never merged. PACKAGE-TEST integration validation of ALREADY-PUBLISHED
# staging packages through pep-integration.yml at the PEP candidate fcb90c05b2b8ca95c1a14a42a42adfdab81ccb83 (local Stage B,
# which contains Stage A), on every platform PEP's catalogs make eligible (amd64 and arm64): anonymizer, mcp
# and ai_db_workbench at PG17 everywhere; docloader at PG17 on the DEB platforms only (its served RPMs have the
# legacy layout integration mode rejects); vectorizer at PG16, PG17 and PG18 everywhere. Temporary validation
# selection only: production fan-out, PG19 and dependency policy are unchanged.
# NOT full application QA and NOT release-workflow validation.
# No build receipts exist for these packages; the sha256 values below come from the staging repository
# metadata read before launch and are NOT receipts. Observe mode keeps failing product tests green, so
# `assert` checks the uploaded evidence, never job colours. Nothing is published, tagged or notified.
# Fresh run only: never re-run jobs of this run; push a new commit for a new run.
on:
  push:
    branches: [validate/pep-fcb90c0-ai-expansion]
permissions: {}
concurrency:
  group: validate-pep-fcb90c0-ai-expansion
  cancel-in-progress: false

