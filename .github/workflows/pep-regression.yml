name: PEP Regression

on:
  workflow_dispatch:
  # Scheduled trigger intentionally disabled for v1.
  # Will be enabled once the workflow is fully validated.
  #
  # When enabling later: schedule fires with empty `inputs.*`. The plan job's
  # parse() helper treats empty as "all" and the test job's `inputs.X || 'default'`
  # fallbacks cover the rest, so no further code changes should be needed —
  # but verify by triggering workflow_dispatch with all defaults (equivalent shape).
  #
  # schedule:
  #   - cron: "0 2 * * *"   # 02:00 UTC nightly, full matrix, repo=release

jobs:
  test:
    name: 'PG${{ matrix.pg }} ${{ matrix.family }} ${{ matrix.arch }}'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { pg: '16', family: 'rpm', arch: 'arm64', runner: 'ubuntu-24.04-arm' }
          - { pg: '16', family: 'rpm', arch: 'amd64', runner: 'ubuntu-24.04' }
          - { pg: '16', family: 'deb', arch: 'arm64', runner: 'ubuntu-24.04-arm' }
          - { pg: '16', family: 'deb', arch: 'amd64', runner: 'ubuntu-24.04' }
          - { pg: '17', family: 'rpm', arch: 'arm64', runner: 'ubuntu-24.04-arm' }
          - { pg: '17', family: 'rpm', arch: 'amd64', runner: 'ubuntu-24.04' }
          - { pg: '17', family: 'deb', arch: 'arm64', runner: 'ubuntu-24.04-arm' }
          - { pg: '17', family: 'deb', arch: 'amd64', runner: 'ubuntu-24.04' }
          - { pg: '18', family: 'rpm', arch: 'arm64', runner: 'ubuntu-24.04-arm' }
          - { pg: '18', family: 'rpm', arch: 'amd64', runner: 'ubuntu-24.04' }
          - { pg: '18', family: 'deb', arch: 'arm64', runner: 'ubuntu-24.04-arm' }
          - { pg: '18', family: 'deb', arch: 'amd64', runner: 'ubuntu-24.04' }
    steps:
      - name: '[slice] Identity'
        run: |
          echo "[slice] pg=${{ matrix.pg }} family=${{ matrix.family }} arch=${{ matrix.arch }} runner=${{ matrix.runner }}"

      - name: '[checkout] Source'
        uses: actions/checkout@v4

      - name: '[python] Set up Python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: '[deps] Install Python deps'
        run: pip install -r requirements.txt

      - name: '[docker] Verify Docker available'
        run: docker version

      - name: '[framework-help] CLI sanity'
        shell: bash
        run: |
          set -o pipefail
          ./run_pep_tf.sh --help
          ./run_pep_tf.sh --help | grep -- '--arch'    > /dev/null
          ./run_pep_tf.sh --help | grep -- '--dry-run' > /dev/null
          echo "[framework-help] OK (--arch and --dry-run advertised)"

      - name: '[framework-command] Dry run'
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test-logs
          CMD="./run_pep_tf.sh --pgver ${{ matrix.pg }} --platforms ${{ matrix.family }} --arch ${{ matrix.arch }} --components pgbouncer --repo release --dry-run"
          echo "[framework-command] $CMD"
          $CMD 2>&1 | tee test-logs/dry-run-output.txt

      - name: '[summary] Write workflow summary artifact'
        if: always()
        shell: bash
        env:
          MATRIX_PG: ${{ matrix.pg }}
          MATRIX_FAMILY: ${{ matrix.family }}
          MATRIX_ARCH: ${{ matrix.arch }}
          MATRIX_RUNNER: ${{ matrix.runner }}
        run: |
          mkdir -p test-logs
          {
            echo "[workflow-summary] ============================================================"
            echo "[workflow-summary] timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "[workflow-summary] github.sha=${{ github.sha }}"
            echo "[workflow-summary] github.ref=${{ github.ref }}"
            echo "[workflow-summary] github.run_id=${{ github.run_id }}"
            echo "[workflow-summary] github.run_number=${{ github.run_number }}"
            echo "[workflow-summary] github.event_name=${{ github.event_name }}"
            echo "[workflow-summary] github.actor=${{ github.actor }}"
            echo "[workflow-summary] runner.os=${{ runner.os }}"
            echo "[workflow-summary] runner.arch=${{ runner.arch }}"
            echo "[workflow-summary] runner.name=${{ runner.name }}"
            echo "[workflow-summary] runner.label=$MATRIX_RUNNER"
            echo "[workflow-summary] execution_mode=preview"
            echo "[workflow-summary] pg=$MATRIX_PG"
            echo "[workflow-summary] family=$MATRIX_FAMILY"
            echo "[workflow-summary] arch=$MATRIX_ARCH"
            echo "[workflow-summary] repo=release"
            echo "[workflow-summary] components=pgbouncer"
            echo "[workflow-summary] python=$(python3 --version 2>&1)"
            echo "[workflow-summary] docker=$(docker --version 2>&1 || echo 'not available')"
            echo "[workflow-summary] ------------------------------------------------------------"
            echo "[workflow-summary] dry-run output:"
            if [[ -f test-logs/dry-run-output.txt ]]; then
              grep -E '\[container-resolution\]|\[image-resolution\]|\[dry-run\]|\[arch-filter\]' test-logs/dry-run-output.txt || echo "  (no tagged lines captured)"
            else
              echo "  (test-logs/dry-run-output.txt not present)"
            fi
            echo "[workflow-summary] ============================================================"
          } | tee test-logs/workflow-summary.txt

      - name: '[artifact] Upload test-logs'
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-pg${{ matrix.pg }}-${{ matrix.family }}-${{ matrix.arch }}
          path: test-logs/
          retention-days: 14
          if-no-files-found: warn

    permissions:
      contents: read
