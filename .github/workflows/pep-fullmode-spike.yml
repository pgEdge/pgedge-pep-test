name: PEP full-mode spike (temporary)

# TEMPORARY, THROWAWAY validation. It exercises the real reusable workflow in
# FULL mode against the verified staging EL9 RPM fixture (exact RPM, amd64), on a
# dedicated branch only. Delete this file and the branch after review -- nothing
# here is meant to reach main.
on:
  push:
    branches:
      - spike/pep-fullmode        # dedicated throwaway branch ONLY -- no other branch can trigger it

permissions:
  contents: read

jobs:
  # Live full-mode call into the reusable workflow (local ref, public repo -> no
  # read token). Pins the immutable implementation ref to the reviewed feature
  # checkpoint. The two optional DockerHub secrets are forwarded EXPLICITLY (not
  # `secrets: inherit`) so image pulls are authenticated.
  full:
    uses: pgEdge/pgedge-pep-test/.github/workflows/pep-integration.yml@cf7c917c7b63b9d8c026a6c4aed720b42cb1debe
    with:
      component: rag
      package_name: pgedge-rag-server
      channel: staging
      expected_version: "2.0.0"
      expected_rpm: "2.0.0-beta1_1.el9"
      expected_binary: "2.0.0-beta1"
      expected_buildnum: "beta1_1"
      effective_tag: "v2.0.0-beta1"
      family: rpm
      arch: amd64
      pg_major: "17"
      container_alias: rocky9-amd64
      scenario: certification
      mode: observe
      execution_mode: full
      invocation_id: rpm-exact-amd64
      pep_implementation_ref: cf7c917c7b63b9d8c026a6c4aed720b42cb1debe
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  # Independent acceptance gate for the EXACT RPM scenario. Observe mode keeps
  # `full` green after HANDLED failures, so this job re-checks the outputs and
  # FAILS the run unless the reusable caller job itself succeeded AND the exact
  # certification passed: completed, a PASS verdict (this is the exact scenario --
  # a fail is NOT acceptable here), all three identity rungs proven, staging
  # channel, and a non-empty summary artifact.
  assert-full:
    needs: full
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Assert exact RPM full-mode acceptance criteria
        env:
          RESULT: ${{ needs.full.result }}
          EXEC: ${{ needs.full.outputs.execution_status }}
          VERDICT: ${{ needs.full.outputs.test_verdict }}
          IDENT: ${{ needs.full.outputs.identity_evidence }}
          CHANNEL: ${{ needs.full.outputs.resolved_channel }}
          ARTIFACT: ${{ needs.full.outputs.summary_artifact }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          result = os.environ.get("RESULT", "")
          exec_status = os.environ.get("EXEC", "")
          verdict = os.environ.get("VERDICT", "")
          try:
              ident = json.loads(os.environ.get("IDENT") or "{}")
          except ValueError:
              ident = {}
          try:
              channel = json.loads(os.environ.get("CHANNEL") or "{}")
          except ValueError:
              channel = {}
          artifact = os.environ.get("ARTIFACT", "")

          print(f"caller job result: {result!r}")
          print(f"execution_status : {exec_status!r}")
          print(f"test_verdict     : {verdict!r}")
          print(f"identity_evidence: {ident}")
          print(f"resolved_channel : {channel}")
          print(f"summary_artifact : {artifact!r}")

          problems = []
          if result != "success":
              problems.append(f"reusable caller job must have completed successfully, got {result!r}")
          if exec_status != "completed":
              problems.append(f"execution_status must be 'completed', got {exec_status!r}")
          if verdict != "pass":
              problems.append(f"test_verdict must be 'pass' for the exact RPM scenario, got {verdict!r}")
          for rung in ("l2a", "l2b", "l1"):
              if ident.get(rung) != "proven":
                  problems.append(f"identity {rung} must be 'proven', got {ident.get(rung)!r}")
          if channel.get("value") != "staging":
              problems.append(f"resolved channel must be 'staging', got {channel!r}")
          if not artifact:
              problems.append("summary_artifact must be non-empty")

          if problems:
              print("\nExact RPM acceptance FAILED:")
              for p in problems:
                  print(f"  - {p}")
              sys.exit(1)
          print("\nExact RPM acceptance PASSED: caller succeeded, framework completed, "
                "exact identity (l2a/l2b/l1) proven on staging.")
          PY
