name: PEP 0045ce4 Spock 6 beta.2 staging existing-package validation (temporary)
# Temporary, branch-scoped caller; never merged. Integration validation of ALREADY-PUBLISHED staging
# packages, NOT QA certification and NOT a build-to-test release: the spock60 6.0.0-beta2 packages
# that pgEdge/spock Release run 44045406576 (tag v6.0.0-beta.2 at d05e2e2b) pushed to staging are
# installed by exact version through pep-integration.yml at the PEP candidate 0045ce4 (draft PR #49)
# on the 14 certified OS/arch cells x PG16/17/18, plus ONE control call at v1_STABLE f16d9f5.
# No build receipts exist for these packages; the sha256 values below come from the staging
# repository metadata read on 2026-11-20 and are NOT receipts. Observe mode keeps failing product
# tests green, so `assert` checks the uploaded evidence, never job colours. Nothing is published.
# Fresh run only: never re-run jobs of this run; push a new commit for a new run.
on:
  push:
    branches: [validate/pep-0045ce4-spock6-staging]
permissions: {}
concurrency:
  group: validate-pep-0045ce4-spock6-staging
  cancel-in-progress: false

