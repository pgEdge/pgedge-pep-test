name: PEP full-mode spike (temporary)

# TEMPORARY, THROWAWAY validation. It exercises the real reusable workflow in
# FULL mode against the verified staging EL9 RPM fixture, on a dedicated branch
# only. The exact RPM amd64 scenario is already proven (run 33786075843); this
# file now covers the three REMAINING RPM paths -- exact arm64, L1-only amd64,
# and an intentional binary mismatch -- as three INDEPENDENT caller/assert pairs
# so one failure never hides the others' evidence. Delete this file and the
# branch after review -- nothing here is meant to reach main.
on:
  push:
    branches:
      - spike/pep-fullmode        # dedicated throwaway branch ONLY -- no other branch can trigger it

permissions:
  contents: read

jobs:
  # ── Scenario 1: EXACT RPM arm64 ────────────────────────────────────────────
  rpm-exact-arm64:
    uses: pgEdge/pgedge-pep-test/.github/workflows/pep-integration.yml@ba5157acf3de9ab7e0c9e25151d03035c6d4cc6b
    with:
      component: rag
      package_name: pgedge-rag-server
      channel: staging
      expected_version: "2.0.0"
      expected_rpm: "2.0.0-beta1_1.el9"
      expected_binary: "2.0.0-beta1"
      expected_buildnum: "beta1_1"
      effective_tag: "v2.0.0-beta1"
      family: rpm
      arch: arm64
      pg_major: "17"
      container_alias: rocky9-arm64
      scenario: certification
      mode: observe
      execution_mode: full
      invocation_id: rpm-exact-arm64
      pep_implementation_ref: ba5157acf3de9ab7e0c9e25151d03035c6d4cc6b
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  assert-rpm-exact-arm64:
    needs: rpm-exact-arm64
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    env:
      RESULT: ${{ needs.rpm-exact-arm64.result }}
      EXEC: ${{ needs.rpm-exact-arm64.outputs.execution_status }}
      VERDICT: ${{ needs.rpm-exact-arm64.outputs.test_verdict }}
      IDENT: ${{ needs.rpm-exact-arm64.outputs.identity_evidence }}
      CHANNEL: ${{ needs.rpm-exact-arm64.outputs.resolved_channel }}
      ARTIFACT: ${{ needs.rpm-exact-arm64.outputs.summary_artifact }}
      EXPECT_VERDICT: pass
      EXPECT_L2A: proven
      EXPECT_L2B: proven
      EXPECT_L1: proven
    steps:
      - name: Assert exact RPM arm64 acceptance
        run: |
          python3 - <<'PY'
          import json, os, sys
          result = os.environ.get("RESULT", "")
          exec_status = os.environ.get("EXEC", "")
          verdict = os.environ.get("VERDICT", "")
          try:
              ident = json.loads(os.environ.get("IDENT") or "{}")
          except ValueError:
              ident = {}
          try:
              channel = json.loads(os.environ.get("CHANNEL") or "{}")
          except ValueError:
              channel = {}
          artifact = os.environ.get("ARTIFACT", "")
          exp_verdict = os.environ.get("EXPECT_VERDICT", "")
          exp_rung = {"l2a": os.environ.get("EXPECT_L2A"),
                      "l2b": os.environ.get("EXPECT_L2B"),
                      "l1": os.environ.get("EXPECT_L1")}

          print(f"caller job result: {result!r}")
          print(f"execution_status : {exec_status!r}")
          print(f"test_verdict     : {verdict!r} (expected {exp_verdict!r})")
          print(f"identity_evidence: {ident} (expected {exp_rung})")
          print(f"resolved_channel : {channel}")
          print(f"summary_artifact : {artifact!r}")

          problems = []
          # Observe mode is report-only: the reusable caller job must stay green
          # even when the product verdict is a truthful fail.
          if result != "success":
              problems.append(f"reusable caller job must be 'success' (observe is report-only), got {result!r}")
          if exec_status != "completed":
              problems.append(f"execution_status must be 'completed', got {exec_status!r}")
          if verdict != exp_verdict:
              problems.append(f"test_verdict must be {exp_verdict!r}, got {verdict!r}")
          for rung in ("l2a", "l2b", "l1"):
              if ident.get(rung) != exp_rung[rung]:
                  problems.append(f"identity {rung} must be {exp_rung[rung]!r}, got {ident.get(rung)!r}")
          if channel.get("value") != "staging":
              problems.append(f"resolved channel must be 'staging', got {channel!r}")
          if not artifact:
              problems.append("summary_artifact must be non-empty")

          if problems:
              print("\nAcceptance FAILED:")
              for p in problems:
                  print(f"  - {p}")
              sys.exit(1)
          print("\nAcceptance PASSED.")
          PY

  # ── Scenario 2: L1-only RPM amd64 (no expected_* pins) ─────────────────────
  rpm-l1-amd64:
    uses: pgEdge/pgedge-pep-test/.github/workflows/pep-integration.yml@ba5157acf3de9ab7e0c9e25151d03035c6d4cc6b
    with:
      component: rag
      package_name: pgedge-rag-server
      channel: staging
      expected_version: "2.0.0"
      family: rpm
      arch: amd64
      pg_major: "17"
      container_alias: rocky9-amd64
      scenario: certification
      mode: observe
      execution_mode: full
      invocation_id: rpm-l1-amd64
      pep_implementation_ref: ba5157acf3de9ab7e0c9e25151d03035c6d4cc6b
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  assert-rpm-l1-amd64:
    needs: rpm-l1-amd64
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    env:
      RESULT: ${{ needs.rpm-l1-amd64.result }}
      EXEC: ${{ needs.rpm-l1-amd64.outputs.execution_status }}
      VERDICT: ${{ needs.rpm-l1-amd64.outputs.test_verdict }}
      IDENT: ${{ needs.rpm-l1-amd64.outputs.identity_evidence }}
      CHANNEL: ${{ needs.rpm-l1-amd64.outputs.resolved_channel }}
      ARTIFACT: ${{ needs.rpm-l1-amd64.outputs.summary_artifact }}
      EXPECT_VERDICT: pass
      EXPECT_L2A: not_attempted
      EXPECT_L2B: not_attempted
      EXPECT_L1: proven
    steps:
      - name: Assert L1-only RPM amd64 acceptance
        run: |
          python3 - <<'PY'
          import json, os, sys
          result = os.environ.get("RESULT", "")
          exec_status = os.environ.get("EXEC", "")
          verdict = os.environ.get("VERDICT", "")
          try:
              ident = json.loads(os.environ.get("IDENT") or "{}")
          except ValueError:
              ident = {}
          try:
              channel = json.loads(os.environ.get("CHANNEL") or "{}")
          except ValueError:
              channel = {}
          artifact = os.environ.get("ARTIFACT", "")
          exp_verdict = os.environ.get("EXPECT_VERDICT", "")
          exp_rung = {"l2a": os.environ.get("EXPECT_L2A"),
                      "l2b": os.environ.get("EXPECT_L2B"),
                      "l1": os.environ.get("EXPECT_L1")}

          print(f"caller job result: {result!r}")
          print(f"execution_status : {exec_status!r}")
          print(f"test_verdict     : {verdict!r} (expected {exp_verdict!r})")
          print(f"identity_evidence: {ident} (expected {exp_rung})")
          print(f"resolved_channel : {channel}")
          print(f"summary_artifact : {artifact!r}")

          problems = []
          if result != "success":
              problems.append(f"reusable caller job must be 'success' (observe is report-only), got {result!r}")
          if exec_status != "completed":
              problems.append(f"execution_status must be 'completed', got {exec_status!r}")
          if verdict != exp_verdict:
              problems.append(f"test_verdict must be {exp_verdict!r}, got {verdict!r}")
          for rung in ("l2a", "l2b", "l1"):
              if ident.get(rung) != exp_rung[rung]:
                  problems.append(f"identity {rung} must be {exp_rung[rung]!r}, got {ident.get(rung)!r}")
          if channel.get("value") != "staging":
              problems.append(f"resolved channel must be 'staging', got {channel!r}")
          if not artifact:
              problems.append("summary_artifact must be non-empty")

          if problems:
              print("\nAcceptance FAILED:")
              for p in problems:
                  print(f"  - {p}")
              sys.exit(1)
          print("\nAcceptance PASSED. (Actual installed package/binary are recorded in "
                "observed-identity.json for audit; not asserted here.)")
          PY

  # ── Scenario 3: intentional binary mismatch on exact RPM amd64 ─────────────
  rpm-wrong-binary-amd64:
    uses: pgEdge/pgedge-pep-test/.github/workflows/pep-integration.yml@ba5157acf3de9ab7e0c9e25151d03035c6d4cc6b
    with:
      component: rag
      package_name: pgedge-rag-server
      channel: staging
      expected_version: "2.0.0"
      expected_rpm: "2.0.0-beta1_1.el9"
      expected_binary: "9.9.9-notreal"
      expected_buildnum: "beta1_1"
      effective_tag: "v2.0.0-beta1"
      family: rpm
      arch: amd64
      pg_major: "17"
      container_alias: rocky9-amd64
      scenario: certification
      mode: observe
      execution_mode: full
      invocation_id: rpm-wrong-binary-amd64
      pep_implementation_ref: ba5157acf3de9ab7e0c9e25151d03035c6d4cc6b
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  assert-rpm-wrong-binary-amd64:
    needs: rpm-wrong-binary-amd64
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    env:
      RESULT: ${{ needs.rpm-wrong-binary-amd64.result }}
      EXEC: ${{ needs.rpm-wrong-binary-amd64.outputs.execution_status }}
      VERDICT: ${{ needs.rpm-wrong-binary-amd64.outputs.test_verdict }}
      IDENT: ${{ needs.rpm-wrong-binary-amd64.outputs.identity_evidence }}
      CHANNEL: ${{ needs.rpm-wrong-binary-amd64.outputs.resolved_channel }}
      ARTIFACT: ${{ needs.rpm-wrong-binary-amd64.outputs.summary_artifact }}
      EXPECT_VERDICT: fail
      EXPECT_L2A: proven
      EXPECT_L2B: not_proven
      EXPECT_L1: proven
    steps:
      - name: Assert wrong-binary RPM amd64 acceptance (observe report-only)
        run: |
          python3 - <<'PY'
          import json, os, sys
          result = os.environ.get("RESULT", "")
          exec_status = os.environ.get("EXEC", "")
          verdict = os.environ.get("VERDICT", "")
          try:
              ident = json.loads(os.environ.get("IDENT") or "{}")
          except ValueError:
              ident = {}
          try:
              channel = json.loads(os.environ.get("CHANNEL") or "{}")
          except ValueError:
              channel = {}
          artifact = os.environ.get("ARTIFACT", "")
          exp_verdict = os.environ.get("EXPECT_VERDICT", "")
          exp_rung = {"l2a": os.environ.get("EXPECT_L2A"),
                      "l2b": os.environ.get("EXPECT_L2B"),
                      "l1": os.environ.get("EXPECT_L1")}

          print(f"caller job result: {result!r}")
          print(f"execution_status : {exec_status!r}")
          print(f"test_verdict     : {verdict!r} (expected {exp_verdict!r})")
          print(f"identity_evidence: {ident} (expected {exp_rung})")
          print(f"resolved_channel : {channel}")
          print(f"summary_artifact : {artifact!r}")

          problems = []
          # The whole point of this scenario: a truthful product FAIL must NOT turn
          # the reusable caller job red in observe (report-only) mode.
          if result != "success":
              problems.append(f"reusable caller job must be 'success' (observe is report-only), got {result!r}")
          if exec_status != "completed":
              problems.append(f"execution_status must be 'completed', got {exec_status!r}")
          if verdict != exp_verdict:
              problems.append(f"test_verdict must be {exp_verdict!r}, got {verdict!r}")
          for rung in ("l2a", "l2b", "l1"):
              if ident.get(rung) != exp_rung[rung]:
                  problems.append(f"identity {rung} must be {exp_rung[rung]!r}, got {ident.get(rung)!r}")
          if channel.get("value") != "staging":
              problems.append(f"resolved channel must be 'staging', got {channel!r}")
          if not artifact:
              problems.append("summary_artifact must be non-empty")

          if problems:
              print("\nAcceptance FAILED:")
              for p in problems:
                  print(f"  - {p}")
              sys.exit(1)
          print("\nAcceptance PASSED: exact install proven (l2a), binary mismatch surfaced "
                "as l2b not_proven / verdict fail, caller stayed green under observe.")
          PY
