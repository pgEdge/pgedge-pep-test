name: PEP Self-Test (diagnostic isolation, throwaway branch)
# DIAGNOSTIC ONLY on the throwaway branch diag/pr28-unit-hang; never merged. It replaces this
# branch's copy of the Self-Test workflow because GitHub dispatches only a workflow file that also
# exists on the default branch. Manual only, and it runs none of Self-Test's preview jobs.
#
# Three independent jobs isolate the unit-step hang seen on PR #28 (three runs on three runners,
# each with the test step never reported complete and no log saved):
#   baseline         main a117063, its exact Self-Test unit selection;
#   pr-no-time-limit PR head 27fdca0, the same selection without pipeline/tests/test_pep_time_limit.py
#                    (excluded from collection only; the file is not changed);
#   pr-time-limit    PR head 27fdca0, pipeline/tests/test_pep_time_limit.py alone.
# Each pytest run has an independent 3-minute limit (coreutils timeout: SIGABRT, which makes the
# fault handler dump every thread, then SIGKILL 30 s later), and each job an 8-minute backstop.
# The output is also kept in a file uploaded as an artifact, when the runner still finishes the
# job; neither the log nor the artifact can survive a runner that stops reporting.
on: {workflow_dispatch: {}}
permissions:
  contents: read
jobs:
  isolate:
    name: ${{ matrix.case }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: baseline
            ref: a11706375e3411bf17968513c2017e6890a726b4
            pytest_args: utillities/test_container_resolver.py utillities/test_ci_consolidated_report.py aspects/tests/ aspects/pipeline/tests/ pipeline/tests/
          - case: pr-no-time-limit
            ref: 27fdca02d018d214c1a4bdd4a6dfacdabf01a5d2
            pytest_args: utillities/test_container_resolver.py utillities/test_ci_consolidated_report.py aspects/tests/ aspects/pipeline/tests/ pipeline/tests/ --ignore=pipeline/tests/test_pep_time_limit.py
          - case: pr-time-limit
            ref: 27fdca02d018d214c1a4bdd4a6dfacdabf01a5d2
            pytest_args: pipeline/tests/test_pep_time_limit.py
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          ref: ${{ matrix.ref }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - name: Record checkout, runtime and memory
        env:
          CASE: ${{ matrix.case }}
          EXPECTED_REF: ${{ matrix.ref }}
        run: |
          echo "case: $CASE"
          echo "checkout: $(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$EXPECTED_REF" || { echo "unexpected checkout"; exit 1; }
          python -c 'import platform, sys; print("python", sys.version.split()[0], sys.executable); print(platform.platform())'
          python -m pytest --version
          echo "kernel: $(uname -srm)  cpus: $(nproc)  user: $(id -un)  pid 1: $(ps -o comm= -p 1)"
          free -m
          grep -E '^(MemTotal|MemAvailable|SwapTotal|SwapFree):' /proc/meminfo
          echo "step shell: pid=$$ pgid=$(ps -o pgid= -p $$ | tr -d ' ') sid=$(ps -o sid= -p $$ | tr -d ' ')"
          echo "step fds: stdin=$(readlink /proc/$$/fd/0) stdout=$(readlink /proc/$$/fd/1) stderr=$(readlink /proc/$$/fd/2)"
      - name: pytest (independent 3-minute diagnostic limit)
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONFAULTHANDLER: "1"
          PYTEST_ARGS: ${{ matrix.pytest_args }}
        run: |
          read -ra args <<< "$PYTEST_ARGS"
          ulimit -c 0                      # no core files from the SIGABRT stack dump
          set +e
          start=$(date +%s)
          # --verbose makes timeout itself report any signal it sends; any other kill shows no such line.
          timeout --verbose --signal=ABRT --kill-after=30s 180s \
            pytest "${args[@]}" -v -o faulthandler_timeout=60 2>&1 | tee pytest-output.log
          rc=${PIPESTATUS[0]}
          echo "== pytest exit status: $rc after $(( $(date +%s) - start )) s (see any 'timeout: sending signal' line above)"
          echo "== process tree after pytest"
          ps -eo pid,ppid,pgid,sid,stat,etime,args --forest
          exit "$rc"
      - name: Keep the pytest output (when the runner still finishes the job)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: isolation-${{ matrix.case }}
          path: pytest-output.log
          if-no-files-found: warn
