jobs:
  cases:
    name: case fixture (9 staging cases; consistency only, no network)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    outputs:
      matrix: ${{ steps.fixture.outputs.matrix }}
    steps:
      - name: Check the fixture and emit the matrix
        id: fixture
        run: |
          python3 - <<'PY'
          import json, os, re
          E = os.environ
          cases = json.loads(E["CASES_JSON"])
          cells = {"oel9-amd64": ("rpm", "amd64", "el9", "auto-oel9-amd"), "debian13-amd64": ("deb", "amd64", "trixie", "auto-debian13-amd")}
          names = {"anonymizer": ("pgedge-anonymizer", "pgedge-anonymizer"), "mcp": ("pgedge-postgres-mcp", "pgedge-postgres-mcp"),
                   "ai_db_workbench": ("pgedge-ai-dba-server", "pgedge-ai-dba-server"), "docloader": ("pgedge-docloader", "pgedge-docloader"),
                   "vectorizer": ("pgedge-vectorizer_%s", "pgedge-postgresql-%s-vectorizer")}
          want_keys = sorted([(c, a) for c in ("anonymizer", "vectorizer", "mcp", "ai_db_workbench") for a in cells] + [("docloader", "debian13-amd64")])
          bad = []
          if sorted((c["component"], c["alias"]) for c in cases) != want_keys:
              bad.append("cases %r" % sorted((c["component"], c["alias"]) for c in cases))
          for c in cases:
              fam, arch, dist, container = cells.get(c["alias"], (None,) * 4)
              pre, _, n = c["buildnum"].rpartition("_")
              tok = ("%s-%s.%s" % (c["version"], c["buildnum"], dist)) if fam == "rpm" else (
                  ("%s~%s-%s.%s" % (c["version"], pre, n, dist)) if pre else ("%s-%s.%s" % (c["version"], n, dist)))
              pkg = names[c["component"]][0 if fam == "rpm" else 1]
              pkg = pkg % c["pg"] if "%s" in pkg else pkg
              want = {"family": fam, "arch": arch, "dist": dist, "container": container, "package": pkg, "token": tok, "pg": "17",
                      "iid": "pilot-%s-%s-pg17" % (c["component"].replace("_", "-"), c["alias"])}
              got = {k: c.get(k) for k in want}
              if got != want:
                  bad.append("%s: %r != %r" % (c.get("iid"), got, want))
              if not re.fullmatch(r"[0-9a-f]{64}", c.get("sha256", "")):
                  bad.append("%s: sha256 malformed" % c.get("iid"))
              if not (set(c["skips"]) <= set(c["tests"]) and len(set(c["tests"])) == len(c["tests"])):
                  bad.append("%s: skips not a subset of the unique testcases" % c.get("iid"))
              if not c["tag"].startswith("v" + c["version"]):
                  bad.append("%s: tag %r does not carry version %r" % (c.get("iid"), c["tag"], c["version"]))
          if len({c["sha256"] for c in cases}) != 9 or sum(len(c["tests"]) for c in cases) != 121 or sum(len(c["skips"]) for c in cases) != 24:
              bad.append("expected 9 distinct digests, 121 testcases and 24 skips")
          if bad:
              raise SystemExit("fixture problems:\n" + "\n".join(bad))
          keep = ("iid", "component", "package", "family", "arch", "alias", "pg", "token", "version", "buildnum", "tag", "title")
          with open(E["GITHUB_OUTPUT"], "a") as f:
              f.write("matrix=%s\n" % json.dumps({"include": [{k: c[k] for k in keep} for c in cases]}, separators=(",", ":")))
          print("9 cases consistent")
          PY

  pilot:
    name: ${{ matrix.title }}
    needs: cases
    permissions: {contents: read}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.cases.outputs.matrix) }}
    uses: pgEdge/pgedge-pep-test/.github/workflows/pep-integration.yml@fcb90c05b2b8ca95c1a14a42a42adfdab81ccb83
    with:
      component: ${{ matrix.component }}
      package_name: ${{ matrix.package }}
      channel: staging
      expected_version: ${{ matrix.version }}
      expected_buildnum: ${{ matrix.buildnum }}
      effective_tag: ${{ matrix.tag }}
      expected_rpm: ${{ matrix.family == 'rpm' && matrix.token || '' }}
      expected_deb: ${{ matrix.family == 'deb' && matrix.token || '' }}
      container_alias: ${{ matrix.alias }}
      pg_major: ${{ matrix.pg }}
      family: ${{ matrix.family }}
      arch: ${{ matrix.arch }}
      scenario: certification
      mode: observe
      execution_mode: full
      invocation_id: ${{ matrix.iid }}
      pep_implementation_ref: fcb90c05b2b8ca95c1a14a42a42adfdab81ccb83
    secrets:
      # Named explicitly (never `secrets: inherit`). The certificate pair enables the gated pgEdge
      # repositories inside the test container; the Docker Hub pair only lifts pull rate limits.
      PGEDGE_REPO_CLIENT_CRT: ${{ secrets.PGEDGE_REPO_CLIENT_CRT }}
      PGEDGE_REPO_CLIENT_KEY: ${{ secrets.PGEDGE_REPO_CLIENT_KEY }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  assert:
    name: assert validation evidence (9 AI-component cases)
    needs: [cases, pilot]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read        # run metadata (referenced_workflows), this attempt's jobs and artifacts, called-job logs
      contents: read       # sparse checkout of the PEP candidate's pipeline/ (production layout contract)
    env:
      CANDIDATE: fcb90c05b2b8ca95c1a14a42a42adfdab81ccb83
      RESULTS_JSON: ${{ toJSON(needs) }}
      GH_TOKEN: ${{ github.token }}
      # One source for the download step and the assert (only this run's pep-summary artifacts match).
      SUMMARY_PATTERN: pep-summary-*-r${{ github.run_number }}-a${{ github.run_attempt }}
    steps:
      - name: Check out the PEP candidate's artifact collector (layout contract only)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          repository: pgEdge/pgedge-pep-test
          ref: fcb90c05b2b8ca95c1a14a42a42adfdab81ccb83
          path: pep
          sparse-checkout: pipeline
          persist-credentials: false
      - name: Download this run's 9 summaries (current attempt only)
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          pattern: ${{ env.SUMMARY_PATTERN }}
          path: summaries
      - name: Check every case from evidence, not job colour
        run: |
          python3 - <<'PY'
          import fnmatch, http.client, json, os, re, subprocess, sys, time, urllib.error, urllib.request
          import xml.etree.ElementTree as ET
          from pathlib import Path
          from urllib.parse import urlsplit

          E = os.environ
          CAND, REPO = E["CANDIDATE"], E["GITHUB_REPOSITORY"]
          RUN_ID, ATT, RUN_NO = E["GITHUB_RUN_ID"], E["GITHUB_RUN_ATTEMPT"], E["GITHUB_RUN_NUMBER"]
          NEEDS = json.loads(E["RESULTS_JSON"])
          CASES = json.loads(E["CASES_JSON"])
          ROOT = Path("summaries")
          SUFFIX = " / full test (install and product tests)"
          IDENTITY = {"l2a": "proven", "l2b": "not_attempted", "l1": "proven"}
          SUMMARY_KEYS = {"invocation_id", "execution_status", "test_verdict", "enforcement_mode",
                          "identity_evidence", "counts", "provenance", "installed_package_sha256"}
          problems, notes, rows, details = [], [], [], {}

          def check(ok, what):
              if not ok:
                  problems.append(what)
              return ok

          # Debian version ordering (a port of dpkg's verrevcmp): epoch numerically, then upstream, then revision;
          # '~' sorts before anything (even the end), letters before other characters, digit runs numerically.
          def dpkg_cmp(a, b):
              def split(v):
                  e, colon, rest = v.partition(":")
                  if not colon:
                      e, rest = "0", v
                  up, dash, rev = rest.rpartition("-")
                  return (int(e), up, rev) if dash else (int(e), rest, "")

              def order(ch):
                  return 0 if ch == "" or ch.isdigit() else ord(ch) if ch.isalpha() else -1 if ch == "~" else ord(ch) + 256

              def verrev(x, y):
                  i = j = 0
                  while i < len(x) or j < len(y):
                      while (i < len(x) and not x[i].isdigit()) or (j < len(y) and not y[j].isdigit()):
                          ac, bc = order(x[i] if i < len(x) else ""), order(y[j] if j < len(y) else "")
                          if ac != bc:
                              return ac - bc
                          i, j = i + 1, j + 1
                      while i < len(x) and x[i] == "0":
                          i += 1
                      while j < len(y) and y[j] == "0":
                          j += 1
                      first = 0
                      while i < len(x) and j < len(y) and x[i].isdigit() and y[j].isdigit():
                          first = first or ord(x[i]) - ord(y[j])
                          i, j = i + 1, j + 1
                      if i < len(x) and x[i].isdigit():
                          return 1
                      if j < len(y) and y[j].isdigit():
                          return -1
                      if first:
                          return first
                  return 0
              (ea, ua, ra), (eb, ub, rb) = split(a), split(b)
              c = (ea > eb) - (ea < eb) or verrev(ua, ub) or verrev(ra, rb)
              return (c > 0) - (c < 0)

          DEB_REL = {"=": lambda c: c == 0, ">=": lambda c: c >= 0, "<=": lambda c: c <= 0, ">>": lambda c: c > 0, "<<": lambda c: c < 0}
          DEB_VERSION = re.compile(r"(?:\d+:)?\d[A-Za-z0-9.+~-]*")

          def gh(path, tries=1):
              for i in range(tries):
                  r = subprocess.run(["gh", "api", path], capture_output=True, text=True)
                  if r.returncode == 0:
                      return r.stdout
                  if i + 1 < tries:
                      time.sleep(15)
              raise RuntimeError("gh api %s failed: %s" % (path, r.stderr.strip()[:300]))

          # Job logs are read as bytes over HTTPS (newer gh refuses text with colour codes). The token is an
          # unredirected header, so it reaches api.github.com only, never the signed log URL; redirects must
          # stay on HTTPS. Control sequences are stripped.
          CONTROL = re.compile(r"\x1b\[[0-?]*[ -/]*[@-~]|\x1b\][^\x07\x1b]*(?:\x07|\x1b\\)|\x1b[@-_]|[\x00-\x08\x0b-\x1f\x7f-\x9f]")

          class HttpsOnlyRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  if urlsplit(newurl).scheme != "https":
                      raise urllib.error.URLError("refused non-HTTPS redirect")
                  return super().redirect_request(req, fp, code, msg, headers, newurl)

          def job_log(jid, tries=4):
              req = urllib.request.Request("https://api.github.com/repos/%s/actions/jobs/%s/logs" % (REPO, jid))
              req.add_unredirected_header("Authorization", "Bearer " + E.get("GH_TOKEN", ""))
              err = None
              for i in range(tries):
                  try:
                      with urllib.request.build_opener(HttpsOnlyRedirect).open(req, timeout=120) as r:
                          return CONTROL.sub("", r.read().decode("utf-8", "replace"))
                  except (OSError, ValueError, http.client.HTTPException) as e:
                      err = e
                  if i + 1 < tries:
                      time.sleep(15)
              raise RuntimeError("job %s log: %s" % (jid, err))

          # Run level: the one reusable-workflow ref (the candidate), this run and attempt, the caller jobs' results.
          for job in ("cases", "pilot"):
              check((NEEDS.get(job) or {}).get("result") == "success", "needs.%s.result %r" % (job, (NEEDS.get(job) or {}).get("result")))
          try:
              run = json.loads(gh("repos/%s/actions/runs/%s" % (REPO, RUN_ID), 3))
              refs = sorted((r.get("path"), r.get("sha")) for r in (run.get("referenced_workflows") or []))
              check(refs == [("pgEdge/pgedge-pep-test/.github/workflows/pep-integration.yml@" + CAND, CAND)], "run: referenced_workflows %r" % refs)
              check((run.get("head_sha"), str(run.get("run_attempt"))) == (E["GITHUB_SHA"], ATT),
                    "run: head_sha/run_attempt %r" % ((run.get("head_sha"), run.get("run_attempt")),))
              jobs = json.loads(gh("repos/%s/actions/runs/%s/attempts/%s/jobs?per_page=100" % (REPO, RUN_ID, ATT), 3))["jobs"]
          except (RuntimeError, ValueError) as e:
              problems.append("run: metadata unavailable: %s" % e)
              jobs = []

          def art(c):
              return "pep-summary-%s-%s-%s-pg%s-staging-%s-certification-full-%s-r%s-a%s" % (
                  c["component"], c["family"], c["arch"], c["pg"], c["alias"], c["iid"], RUN_NO, ATT)

          names = {c["iid"]: art(c) for c in CASES}
          # Download layout: download-artifact v7.0.0 with `pattern:` -> none: nothing; ONE: flat into summaries/;
          # several: summaries/<name>/. The downloaded set is re-derived from this run's artifact listing with the
          # same pattern, and each case root is resolved with PEP's production collector contract at the candidate.
          sys.path.insert(0, str(Path("pep/pipeline").resolve()))
          import pep_result_io as RIO
          listed = []
          try:
              page = 1
              while True:
                  got = json.loads(gh("repos/%s/actions/runs/%s/artifacts?per_page=100&page=%d" % (REPO, RUN_ID, page), 3))["artifacts"]
                  listed += got
                  if len(got) < 100:
                      break
                  page += 1
          except (RuntimeError, ValueError, KeyError, TypeError) as e:
              problems.append("artifacts: run listing unavailable: %s" % e)
          matched = [a.get("name") for a in listed if fnmatch.fnmatchcase(a.get("name") or "", E["SUMMARY_PATTERN"]) and not a.get("expired")]
          downloaded = sorted(set(matched))
          check(len(matched) == len(downloaded), "artifacts: duplicate names %r" % sorted({n for n in matched if matched.count(n) > 1}))
          check(downloaded == sorted(names.values()), "artifacts: %d downloaded, %d expected; missing %r; unexpected %r" % (
              len(downloaded), len(names), sorted(set(names.values()) - set(downloaded)), sorted(set(downloaded) - set(names.values()))))
          entries = sorted(p.name for p in ROOT.iterdir()) if ROOT.is_dir() else []
          if len(downloaded) > 1:
              check(entries == downloaded, "artifacts: download folder holds %r, expected one folder per downloaded artifact" % entries[:10])
          roots = {}
          for iid_, name_ in names.items():
              # Like the production collector, only a DOWNLOADED artifact is resolved (a flat root never stands in for another name).
              root_, anomaly_ = RIO._resolve_root(str(ROOT), name_, len(downloaded)) if name_ in downloaded else (None, RIO.EX_MISSING)
              if anomaly_ is None:
                  roots[iid_] = Path(root_)
              else:
                  problems.append("%s: artifact layout %s for %s" % (iid_, anomaly_, name_))

          def markers(c, pv):
              """Per-product job-log lines the candidate prints on success (regex -> optional check)."""
              pkg, tok, esc = c["package"], c["token"], re.escape(c["package"])
              m = {"pinned_install": re.escape("pinned install: %s=%s sha256=%s" % (pkg, tok, c["sha256"]))}
              comp = c["component"]
              if comp == "anonymizer":
                  m.update(single=r"Only %s is installed among anonymizer packages" % esc,
                           owner=r"/usr/bin/pgedge-anonymizer belongs to %s\s" % esc,
                           binary=r"/usr/bin/pgedge-anonymizer reports version %s, built \S+ \(expected %s\)" % (re.escape(c["version"]), re.escape(c["version"])),
                           stripped=r"/usr/bin/pgedge-anonymizer is stripped")
              elif comp == "docloader":
                  m.update(single=r"Only %s is installed among docloader packages" % esc,
                           owner=r"/usr/bin/pgedge-docloader belongs to %s\s" % esc,
                           binary=re.escape("/usr/bin/pgedge-docloader reports version %s (expected %s)" % (c["version"], c["version"])))
              elif comp == "mcp":
                  m.update(single=r"Only %s is installed among MCP packages" % esc)
              elif comp == "ai_db_workbench":
                  dep = re.escape(c["prereq"]["dependency"])
                  m.update(single=r"Only %s and its dependency %s are installed among workbench packages" % (esc, dep),
                           dependency_installed=r"installed %s = (\S+)" % dep,
                           dependency_declared=r"Dependency '%s' declared in %s" % (dep, esc),
                           stripped=r"/usr/bin/ai-dba-server is stripped")
              elif comp == "vectorizer":
                  p = c["prereq"]
                  m.update(single=r"Only %s is installed among vectorizer packages" % esc,
                           server_installed=r"installed %s = (%s\.\d+-\S+)" % (re.escape(p["server"]), c["pg"]),
                           pgvector_installed=r"installed %s = (\S+)" % re.escape(p["pgvector"]),
                           package_installed=r"installed %s = (%s)\s" % (esc, re.escape(tok)),
                           create_vector=r"CREATE EXTENSION vector\s",
                           create_vectorizer=r"CREATE EXTENSION pgedge_vectorizer\s",
                           library_owner=r"\S+/pgedge_vectorizer\.so belongs to %s\s" % esc,
                           server=r"port \d+: PostgreSQL (\d+), pgedge_vectorizer (\S+)")
              return m

          for c in CASES:
              fam, pkg, tok, pg, digest, iid = c["family"], c["package"], c["token"], c["pg"], c["sha256"], c["iid"]
              tag = iid + ": "
              d = roots.get(iid) or ROOT / ".layout-unresolved" / names[iid]   # unresolved -> evidence missing, never read
              det = details[iid] = {"artifact": names[iid], "pep": CAND, "expected_sha256": digest}
              target = {"package_name": pkg, "family": fam, "arch": c["arch"], "pg_major": pg,
                        "container_alias": c["alias"], "channel": "staging"}
              run_token = "%s-%s" % (RUN_ID, ATT)

              def load(f):
                  return json.loads((d / f).read_text())
              try:
                  s, inst, obs, ide, prov, rc, cur = (load(f) for f in (
                      "summary.json", "install-evidence.json", "observed-identity.json", "identity-evidence.json",
                      "provenance.json", "resolved-config.json", "current-run.json"))
              except (OSError, ValueError) as e:
                  problems.append(tag + "evidence missing/unreadable: %s" % e)
                  rows.append("| %s | evidence missing | | | |" % iid)
                  continue
              want_prov = {"caller_repo": REPO, "caller_sha": E["GITHUB_SHA"], "caller_ref": E["GITHUB_REF"],
                           "caller_run_id": RUN_ID, "caller_run_attempt": ATT,
                           "pep_requested_ref": CAND, "pep_resolved_sha": CAND}
              want_counts = {"tests": len(c["tests"]), "failures": 0, "errors": 0, "skipped": len(c["skips"])}
              check(set(s) == SUMMARY_KEYS, tag + "summary keys %r (reason/malformed_reports must be absent)" % sorted(s))
              check(s.get("invocation_id") == iid, tag + "invocation_id %r" % s.get("invocation_id"))
              check((s.get("execution_status"), s.get("test_verdict"), s.get("enforcement_mode")) == ("completed", "pass", "observe"),
                    tag + "status %r, expected completed/pass/observe" % ((s.get("execution_status"), s.get("test_verdict"), s.get("enforcement_mode")),))
              check(s.get("identity_evidence") == IDENTITY and ide == IDENTITY, tag + "identity %r / %r" % (s.get("identity_evidence"), ide))
              check(s.get("counts") == want_counts, tag + "counts %r != %r" % (s.get("counts"), want_counts))
              check(s.get("installed_package_sha256") == digest, tag + "installed sha256 %r != staging metadata %r" % (s.get("installed_package_sha256"), digest))
              check(prov == want_prov and s.get("provenance") == want_prov, tag + "provenance %r / %r" % (prov, s.get("provenance")))
              check(inst == {"run_token": run_token, "installed": True, "install_kind": "pinned", "install_token": tok,
                             "installed_sha256": digest, "target": target, "expected_version": c["version"]},
                    tag + "install evidence %r" % inst)
              ob = obs.get("observed") or {}
              check(obs.get("run_token") == run_token and obs.get("target") == target
                    and ob.get("package_manager_version") == tok and ob.get("component_version") == tok
                    and ob.get("binary_version") is None, tag + "observed identity %r" % obs)
              check(rc.get("repo") == {"value": "staging", "source": "caller"}
                    and rc.get("scenario") == {"value": "certification", "source": "caller"}
                    and (rc.get("upgrade") or {}).get("value") == "false", tag + "resolved-config %r" % rc)
              det.update(installed_sha256=s.get("installed_package_sha256"), counts=s.get("counts"), observed=ob)

              reports = sorted({re.sub(r"^.*?test-logs/", "", r) for r in (cur.get("reports") or [])})
              if not check(len(reports) == 1 and Path(reports[0]).name == c["report"], tag + "reports %r" % cur.get("reports")):
                  rows.append("| %s | %s/%s | reports wrong | | |" % (iid, s.get("execution_status"), s.get("test_verdict")))
                  continue
              try:
                  xml_root = ET.parse(d / reports[0]).getroot()
              except (OSError, ET.ParseError) as e:
                  problems.append(tag + "JUnit unreadable: %s" % e)
                  continue
              want_names, want_skips = c["tests"], c["skips"]
              tcs = list(xml_root.iter("testcase"))
              names_seen = [tc.get("name") or "" for tc in tcs]
              dup = sorted({n for n in names_seen if names_seen.count(n) > 1})
              check(names_seen == want_names, tag + "testcases differ from the frozen inventory: missing %r, unexpected %r, "
                    "duplicated %r, same set in another order: %s" % (sorted(set(want_names) - set(names_seen)),
                    sorted(set(names_seen) - set(want_names)), dup, sorted(names_seen) == sorted(want_names) and names_seen != want_names))
              skipped, failed = {}, {}
              for tc in tcs:
                  nm = tc.get("name") or ""
                  check(tc.get("classname") == c["classname"], tag + "%s classname %r" % (nm, tc.get("classname")))
                  kinds = [k for k in ("failure", "error", "skipped") if tc.find(k) is not None]
                  if kinds == ["skipped"]:
                      skipped[nm] = tc.find("skipped").get("message")
                  elif kinds:
                      el = tc.find(kinds[0])
                      failed[nm] = "/".join(kinds) + ": " + (el.get("message") or "") + "\n" + (el.text or "")
              check(not failed, tag + "failed or errored testcases %r" % {k: v[:300] for k, v in failed.items()})
              check(skipped == want_skips, tag + "skips %r != %r" % (skipped, want_skips))
              passed = [n for n in names_seen if n not in skipped and n not in failed]
              check(passed == [n for n in want_names if n not in want_skips], tag + "passed testcases %r" % passed)
              suites = list(xml_root.iter("testsuite"))
              totals = {k: sum(int(ts.get(k) or 0) for ts in suites) for k in ("tests", "failures", "errors", "skipped")}
              check(len(suites) == 1 and totals == want_counts, tag + "JUnit testsuite totals %r != %r" % (totals, want_counts))
              det.update(passed=len(passed), skipped=skipped, failed=sorted(failed), testcases=names_seen)

              # Prerequisite evidence: vectorizer (server + pgvector, unversioned), workbench (the declared upgrade-check
              # dependency, never certified, checked against its declared constraint); docloader, anonymizer and mcp
              # install nothing else and write none.
              pv_path = d / "prerequisite-versions.json"
              p = c["prereq"]
              pv = {}
              if p is None:
                  check(not pv_path.exists(), tag + "unexpected prerequisite-versions.json for a package with no prerequisite")
              else:
                  try:
                      pv = json.loads(pv_path.read_text())
                  except (OSError, ValueError) as e:
                      problems.append(tag + "prerequisite-versions.json: %s" % e)
                  iv = pv.get("installed_versions") or {}
                  if p["kind"] == "vectorizer":
                      ok_ = (pv.get("channel") == "staging" and pv.get("pg_major") == pg and pv.get("requested_package") == pkg
                             and set(iv) == {p["server"], p["pgvector"], pkg} and iv.get(pkg) == tok
                             and re.fullmatch(r"%s\.\d+-\S+" % pg, iv.get(p["server"]) or "") is not None and bool(iv.get(p["pgvector"])))
                      check(ok_, tag + "prerequisites %r" % pv)
                      for k_, want_ in ((p["server"], p["server_frozen"]), (p["pgvector"], p["pgvector_frozen"])):
                          if iv.get(k_) != want_:
                              notes.append(tag + "%s %s differs from the %s staging served at prep time" % (k_, iv.get(k_), want_))
                  else:
                      dep, con = p["dependency"], p["constraint"]
                      have = iv.get(dep)
                      check(pv.get("channel") == "staging" and pv.get("requested_package") == pkg
                            and pv.get("installed_as_dependency") == [dep] and set(iv) == {dep, pkg} and iv.get(pkg) == tok,
                            tag + "prerequisites %r" % pv)
                      if fam == "rpm":
                          # Requires(pre): dep = <EVR>: only that exact build is acceptable.
                          check(con["op"] == "EQ" and have == con["version"] == p["frozen"],
                                tag + "%s %r, the RPM requires exactly %s" % (dep, have, con["version"]))
                      else:
                          # Pre-Depends: dep (<op> <version>): enforced with Debian version ordering; below the minimum
                          # fails, a newer version that satisfies it is a note.
                          rel = DEB_REL.get(con["op"])
                          sat = (rel is not None and isinstance(have, str) and DEB_VERSION.fullmatch(have) is not None
                                 and rel(dpkg_cmp(have, con["version"])))
                          if check(sat, tag + "%s %r does not satisfy the declared %s: %s (%s %s) (Debian version ordering)" % (
                                  dep, have, p["field"], dep, con["op"], con["version"])) and have != p["frozen"]:
                              notes.append(tag + "%s %s differs from the %s staging served at prep time (it satisfies %s %s)" % (
                                  dep, have, p["frozen"], con["op"], con["version"]))

              jid = [j["id"] for j in jobs if j["name"].startswith(c["title"]) and j["name"].endswith(SUFFIX)]
              log = ""
              if check(len(jid) == 1 and all(j["conclusion"] == "success" for j in jobs if j["id"] in jid), tag + "called job %r" % jid):
                  try:
                      log = job_log(jid[0])
                  except RuntimeError as e:
                      problems.append(tag + "job log unavailable: %s" % e)
              seen = {}
              for key, pat in markers(c, pv).items():
                  m = re.search(pat, log)
                  seen[key] = m.group(0).strip() if m else None
                  check(m is not None, tag + "job log lacks %s (%r)" % (key, pat))
                  iv = pv.get("installed_versions") or {}
                  if m and key == "server":
                      mm = re.fullmatch(r"%s\.(\d+)-\S+" % pg, iv.get(c["prereq"]["server"]) or "")
                      want_num = "%s00%02d" % (pg, int(mm.group(1))) if mm else None
                      check(m.group(1) == want_num and m.group(2) == c["version"],
                            tag + "server runs PostgreSQL %s pgedge_vectorizer %s, expected %s / %s" % (m.group(1), m.group(2), want_num, c["version"]))
                  if m and key in ("server_installed", "pgvector_installed", "dependency_installed"):
                      want_ = iv.get({"server_installed": (c["prereq"] or {}).get("server"), "pgvector_installed": (c["prereq"] or {}).get("pgvector"),
                                      "dependency_installed": (c["prereq"] or {}).get("dependency")}[key])
                      check(m.group(1) == want_, tag + "log %s %s != evidence %s" % (key, m.group(1), want_))
              det.update(prerequisites=pv.get("installed_versions"), log_markers=seen, called_job_id=jid[0] if jid else None)
              rows.append("| %s | %s/%s | %d passed, %d skipped, %d failed | `%s` | %s |" % (
                  iid, s.get("execution_status"), s.get("test_verdict"), len(passed), len(skipped), len(failed),
                  s.get("installed_package_sha256"), "match" if s.get("installed_package_sha256") == digest else "MISMATCH"))

          verdict = "fail" if problems else "pass"
          Path("validation-result.json").write_text(json.dumps(
              {"candidate_pep": CAND, "run_id": RUN_ID, "run_attempt": ATT, "caller_sha": E["GITHUB_SHA"],
               "cases_frozen": CASES, "verdict": verdict, "problems": problems, "notes": notes, "cases": details}, indent=1, sort_keys=True))
          head = "All 9 cases verified from evidence: the frozen testcase inventories, 97 passed and only the 24 documented skips.\n"
          with open(E["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("### PEP fcb90c0 AI-component pilot: package-test integration validation of existing staging packages "
                      "(not full application QA, not release-workflow validation)\n\n"
                      "| case | status | testcases | installed sha256 | vs staging metadata |\n|---|---|---|---|---|\n"
                      + "\n".join(rows) + "\n\n"
                      + ("**FAILED**\n\n" + "\n".join("- " + p for p in problems) if problems else head)
                      + ("\n\nNotes:\n" + "\n".join("- " + n for n in notes) if notes else ""))
          print("\n".join(rows))
          if notes:
              print("\n".join(notes))
          if problems:
              print("\n".join(problems), file=sys.stderr)
              sys.exit(1)
          print(head)
          PY
      - name: Upload the assertion result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pep-validation-fcb90c0-ai-pilot-result-r${{ github.run_number }}-a${{ github.run_attempt }}
          path: validation-result.json
          if-no-files-found: warn
